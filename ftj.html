  /* 东财 kline/trends: t,o,c,h,l,v,amt,...(f61=换手 在第11列) ; 东财 fflow: t,主力,小,中,大,超大,... */
  function fromFields(f, out, src) {   /* src='s' 逗号字符串(东财) / 'a' 数组(腾讯) */
    var t = normT(f[0]); if (!t) return;

      var f = lines[i].split(sep).map(function (s) { return s.trim().replace(/^"|"$/g, ''); });
      if (!map) { fromFields(f, out, 's'); continue; }
      var t = normT(f[map.t], map.hm != null ? f[map.hm] : null); if (!t) continue;

  }
  function walkJSON(o, out, depth) {

      if (o.length && Array.isArray(o[0]) && o[0].length >= 5 && normT(o[0][0])) { o.forEach(function (r) { fromFields(r, out, 'a'); }); return; }   /* 腾讯 qfqday/m5: [t,o,c,h,l,v] */

  function parseFile(name, txt) {

  function lvOf(bars) {   /* 有时分 → 看相邻同日K的分钟差; 无 → 日 */

    var cnt = {}; for (var i = 1; i < Math.min(bars.length, 400); i++) { var a = bars[i - 1].t, b = bars[i].t; if (a.slice(0, 8) !== b.slice(0, 8)) continue; var d = (+b.slice(8, 10) * 60 + +b.slice(10)) - (+a.slice(8, 10) * 60 + +a.slice(10)); if (d > 0 && d <= 120) cnt[d] = (cnt[d] || 0) + 1; }

  function draw() {

        out.push(parseFile(f.name, txt)); fin();

    function fin() { if (--left > 0) return; CC = {}; var ok = out.filter(function (p) { return p.k.length || p.ff.length; }); if (!ok.length) { $('main').innerHTML = '<div class="card empty">认不出这' + (out.length > 1 ? '些' : '个') + '文件<br>' + out.map(function (p) { return p.file; }).join('<br>') + '</div>'; return; } merge(ok); draw(); }
    this.value = '';
  });
  W.FTJ = { parseFile: parseFile, merge: function (p) { CC = {}; merge(p); draw(); }, compute: function (lv) { return compute(lv || UI.lv); }, ui: UI, data: function () { return D; } };   /* 冒烟脚本用 */
  try { var o = JSON.parse(localStorage.getItem(SK) || 'null'); if (o && o.sets) { D = o; if (!UI.lv || !D.sets[UI.lv]) UI.lv = D.sets['日'] ? '日' : Object.keys(D.sets)[0]; } } catch (e) { }
