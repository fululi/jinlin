<script>
const HCODES=["600105", "000892", "002172", "002343", "002716", "600011", "600127", "600371", "600489", "600547", "600795", "600900", "600916", "603986", "605577"];

/* 数据: 本股长历史(有就加载 jl_amp_h_<code>.js) + App 里的分钟线(1分够200根用1分, 否则5分) + App 日K(昨收/日均振幅/10日线) */
const PW=(()=>{try{return window.parent!==window&&parent.LIVE?parent:null}catch(e){return null}})();
const QS=new URLSearchParams(location.search);if(!PW)document.body.classList.add('solo');
const CODE=(PW&&PW.STK&&PW.STK.code)||QS.get('code')||'600105',NAME=(PW&&PW.STK&&PW.STK.name)||'';
const d8=s=>String(s).replace(/\D/g,'').slice(0,8),iso=s=>s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);
function liveDays(){const out={},tm={};if(!PW)return {out,tm};const H=PW.LIVE.hist||{};
 const grp=k=>{const g={};(H[k]||[]).forEach(b=>{if(!(b.c>0))return;const s=String(b.t).replace(/\D/g,''),d=iso(s.slice(0,8));(g[d]=g[d]||[]).push([b.o||b.c,b.h||b.c,b.l||b.c,b.c,s.slice(8,10)+':'+s.slice(10,12)])});return g};
 const g1=grp('m1'),g5=grp('m5');const ds=new Set([...Object.keys(g1),...Object.keys(g5)]);
 ds.forEach(d=>{const a=(g1[d]&&g1[d].length>=200)?g1[d]:(g5[d]&&g5[d].length>=30?g5[d]:(g1[d]||g5[d]));out[d]=a.map(x=>x.slice(0,4));tm[d]=a.map(x=>x[4])});return {out,tm}}
function dayMap(){const m={};if(!PW)return m;(PW.LIVE.hist.day||[]).forEach(b=>{if(b.c>0)m[iso(d8(b.t))]=[b.o,b.h,b.l,b.c]});return m}
function loadH(){return new Promise(r=>{if(!HCODES.includes(CODE)||(window.JL_AMP_H&&JL_AMP_H[CODE]))return r();const s=document.createElement('script');s.src='jl_amp_h_'+CODE+'.js';s.onload=()=>r();s.onerror=()=>r();document.head.appendChild(s)})}
let SRC=null;
/* 多股振幅做T引擎(和 flex.py 同一套, 参数可调). 只用当时已知的价; 只算差价; 费用逐笔扣 */
function decodeStock(S){const D={},TM={};let prev=S.p0;
 for(const d of S.days){const a=S.b[d],t=S.t[d],bars=[],ks=[];let p=prev,k=-1;
  for(let i=0;i<a.length;i+=4){const o=p+a[i];const h=o+a[i+1],l=o-a[i+2],c=l+a[i+3];bars.push([o/100,h/100,l/100,c/100]);p=c;k+=parseInt(t[i/4],36);ks.push(k)}
  if(prev==null){/* 第一天第一根: 编码时 p=第一根开盘 => a[0]=0 */}
  D[d]=bars;TM[d]=ks.map(k=>{const m=k<=120?570+k:780+(k-121);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')});prev=p}
 return {D,TM}}
function fee(a,s){return Math.max(5,a*2.5e-4)+a*0.1e-4+(s?a*5e-4:0)}
function pnl(s,b,q){return s*q-b*q-fee(s*q,1)-fee(b*q,0)}
const upT=t=>Math.ceil(Math.round(t*1e6)/1e4)/100, dnT=t=>Math.floor(Math.round(t*1e6)/1e4)/100;
function legsOf(bars,cut){const p=bars.map(b=>b[3]),up=[],dn=[];let dr=0,hp=p[0],lp=p[0],lp0=0,hp0=0;
 for(let i=1;i<p.length;i++){const x=p[i];hp=Math.max(hp,x);lp=Math.min(lp,x);
  if(dr>=0&&x<=hp*(1-cut)){if(dr===1)up.push(hp/lp0-1);dr=-1;hp0=hp;lp=x}
  else if(dr<=0&&x>=lp*(1+cut)){if(dr===-1)dn.push(1-lp/hp0);dr=1;lp0=lp;hp=x}}
 return [up,dn]}
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
function prepInfo(S,D,cut){const days=S.days,pc={},AMP={},UP={},MA={},CAT={};
 const C=S.pre.concat(days.map(d=>D[d][D[d].length-1][3])),off=S.pre.length,L={};
 days.forEach(d=>L[d]=legsOf(D[d],cut));
 days.forEach((d,n)=>{if(n===0)return;pc[d]=D[days[n-1]][D[days[n-1]].length-1][3];
  const pv=days.slice(Math.max(1,n-20),n);if(pv.length)AMP[d]=mean(pv.map(z=>{const b=D[z];return (Math.max(...b.map(x=>x[1]))-Math.min(...b.map(x=>x[2])))/pc[z]}));
  const pu=days.slice(Math.max(0,n-20),n).flatMap(z=>L[z][0]);UP[d]=mean(pu);
  const i=n+off,w=C.slice(Math.max(0,i-10),i);MA[d]=w.length>=5?C[i-1]>=mean(w):false;
  const g=D[d][0][0]/pc[d]-1;CAT[d]=g>=0.01?'高开':g<=-0.01?'低开':'平开'});
 return {pc,AMP,UP,MA,CAT}}
/* P: {xa:振幅倍数, rb:回落接, gap:高开先卖门槛(0=关), base:底仓, q:每次股数, carry:隔天等(true/false)} */
function runT(S,D,F,P){const T=[];let carry=null;const days=S.days.filter(d=>F.AMP[d]!=null&&F.pc[d]);
 const maxS=Math.max(1,Math.min(3,Math.floor(P.base/P.q)));
 for(const d of days){const r=D[d],Pc=F.pc[d],A=F.AMP[d],op=r[0][0],gap=op/Pc-1;
  let pos=carry;carry=null;let sells=0,dlo=null,lastbuy=null,lowafter=null,lastBuyBar=-1;
  for(let i=0;i<r.length;i++){const [o,h,l,c]=r[i];
   if(i===0&&P.gap>0&&gap>=P.gap&&pos==null){pos={d,i:0,s:o,sh:Math.max(o,h),why:'①高开先卖',q:P.q};sells++;dlo=l;continue}
   if(pos!=null){const t=dnT(Math.min(pos.sh*(1-P.rb),pos.s-0.01));
    if(l<=t){const b=Math.min(t,o);T.push({sd:pos.d,si:pos.i,s:pos.s,d,bi:i,b,why:pos.why,how:pos.d===d?'当天接':'隔天接',q:pos.q,v:pnl(pos.s,b,pos.q),cat:F.CAT[pos.d]});pos=null;lastbuy=b;lowafter=Math.min(b,c);lastBuyBar=i}
    else pos.sh=Math.max(pos.sh,h)}
   else if(sells<maxS&&dlo!=null&&lastBuyBar!==i){
    const t=lastbuy==null?upT(dlo+P.xa*A*Pc):upT(Math.max(dlo+P.xa*A*Pc,lowafter*(1+F.UP[d])));
    if(h>=t){const s=Math.max(t,o);pos={d,i,s,sh:Math.max(s,c),why:lastbuy==null?'②振幅到位':'③接回再卖',q:P.q};sells++}}
   if(lowafter!=null&&pos==null)lowafter=Math.min(lowafter,l);
   dlo=dlo==null?l:Math.min(dlo,l)}
  if(pos!=null){pos.w=(pos.w||0)+1;const last=d===days[days.length-1];
   if(!P.carry||F.MA[pos.d]||pos.w>=3||last){const b=r[r.length-1][3];T.push({sd:pos.d,si:pos.i,s:pos.s,d,bi:r.length-1,b,why:pos.why,how:last&&P.carry&&!F.MA[pos.d]&&pos.w<3?'数据截止按收盘':pos.d===d?'收盘接':'到期收盘接',q:pos.q,v:pnl(pos.s,b,pos.q),cat:F.CAT[pos.d]})}
   else carry=pos}}
 return T}


let DATA=null,CUTV=0.015;const CACHE={};
let ALLD=[],AIX={};let days=[],IX={},DV=[],TR=[],NET={};
let per=localStorage.getItem('jlamp_per')||'全部';
function P(){const g=id=>document.getElementById(id).value;return {xa:+g('p_xa'),rb:+g('p_rb'),gap:+g('p_gap'),base:+g('p_base'),q:Math.min(+g('p_q'),+g('p_base')),carry:g('p_carry')==='1',cut:+g('p_cut')}}
function buildSrc(){const D={},TM={};let hd=0,ld=0;
 if(window.JL_AMP_H&&JL_AMP_H[CODE]){const x=decodeStock(JL_AMP_H[CODE]);Object.assign(D,x.D);Object.assign(TM,x.TM);hd=Object.keys(x.D).length}
 const L=liveDays(),last=Object.keys(D).sort().pop()||'';for(const d in L.out)if(d>last&&L.out[d].length>=10){D[d]=L.out[d];TM[d]=L.tm[d];ld++}
 const days=Object.keys(D).sort();return {D,TM,days,hd,ld,dm:dayMap()}}
function prepInfo2(S,D,cut,dm){const F=prepInfo({days:S.days,pre:[]},D,cut);const dk=Object.keys(dm).sort();if(dk.length<12)return F;
 const md=S.days,mc=d=>D[d][D[d].length-1][3];let kf=1;for(let i=md.length-1;i>=0;i--)if(dm[md[i]]){kf=mc(md[i])/dm[md[i]][3];break}
 S.days.forEach(d=>{const n=dk.indexOf(d);if(n<1)return;const mi=md.indexOf(d),pd=dk[n-1];F.pc[d]=(mi>0&&md[mi-1]===pd)?mc(pd):dm[pd][3]*kf;const pv=dk.slice(Math.max(1,n-20),n);if(pv.length>=5)F.AMP[d]=mean(pv.map(z=>{const k=dk.indexOf(z);return (dm[z][1]-dm[z][2])/dm[dk[k-1]][3]}));
  const w=dk.slice(Math.max(0,n-10),n).map(z=>dm[z][3]);if(w.length>=5)F.MA[d]=dm[pd][3]>=mean(w);const g=D[d][0][0]/F.pc[d]-1;F.CAT[d]=g>=0.01?'高开':g<=-0.01?'低开':'平开'});return F}
function load(){const p=P();CUTV=p.cut;localStorage.setItem('jlamp_p2',JSON.stringify([...document.querySelectorAll('.ps select')].map(s=>s.value)));
 const S={days:SRC.days};const F=prepInfo2(S,SRC.D,p.cut,SRC.dm);const T=runT(S,SRC.D,F,p);const dd=S.days.filter(d=>F.AMP[d]!=null&&F.pc[d]);
 DATA={days:dd,tm:SRC.TM,bars:Object.fromEntries(dd.map(d=>[d,SRC.D[d].map(b=>b.map(x=>Math.round(x*100)))])),daily:dd.map(d=>{const b=SRC.D[d];return [b[0][0],Math.max(...b.map(x=>x[1])),Math.min(...b.map(x=>x[2])),b[b.length-1][3]]}),
  info:Object.fromEntries(dd.map(d=>[d,{cat:F.CAT[d],gap:+((SRC.D[d][0][0]/F.pc[d]-1)*100).toFixed(1),ma10:F.MA[d],amp:F.AMP[d]*100,pc:F.pc[d]}])),ph:CODE==='600105'?[['上涨A','2026-04-01','2026-06-25'],['下跌1','2026-06-26','2026-07-29'],['上涨B','2026-07-30','2026-09-21'],['下跌2','2026-09-22','2026-11-06']]:[],base:p.base,
  tr:T.map(t=>[t.sd,t.si,t.s,t.d,t.bi,t.b,t.why,t.how,Math.round(t.v),t.cat,t.q])};
 ALLD=DATA.days;AIX={};ALLD.forEach((d,i)=>AIX[d]=i);if(per!=='全部'&&per!=='近一个月'&&!DATA.ph.some(x=>x[0]===per))per='全部';
 setPer();document.getElementById('ttl').innerHTML='<span>'+(NAME||CODE)+' · 振幅做T复盘</span><small>'+(ALLD.length?ALLD[0].slice(5)+'～'+ALLD[ALLD.length-1].slice(5)+' '+ALLD.length+'天'+(SRC.hd?'':' (App分钟线)'):'')+'</small>';if(!(sel in IX))sel=days[days.length-1]}

function setPer(){let st='0',en='9';if(per==='近一个月')st='2026-10-09';for(const [p,a,b] of DATA.ph)if(per===p){st=a;en=b}
 days=ALLD.filter(d=>d>=st&&d<=en);if(!days.length)days=ALLD;IX={};days.forEach((d,i)=>IX[d]=i);DV=days.map(d=>DATA.daily[AIX[d]]);
 TR=DATA.tr.filter(t=>t[0]>=st&&t[0]<=en);NET={};for(const c of ['高开','平开','低开','全部']){NET[c]={};for(const t of TR)if(c==='全部'||t[9]===c)NET[c][t[3]]=(NET[c][t[3]]||0)+t[8]}}
const CAT=['高开','平开','低开'],CC={高开:'#ff5459',平开:'#c9d1dc',低开:'#1fdc93'};
let cat=localStorage.getItem('jlamp_cat')||'全部',sel=null;
const fmt=v=>(v>0?'+':'')+Math.round(v).toLocaleString('en-US'),cls=v=>v>0?'pos':v<0?'neg':'';
const phaseOf=d=>{for(const [p,a,b] of DATA.ph)if(d>=a&&d<=b)return p;return ''};
const sum=a=>a.reduce((s,t)=>s+t[8],0);

function prep(cv){const r=devicePixelRatio||1,w=Math.floor(cv.parentNode.clientWidth),h=+(cv.dataset.h||(cv.dataset.h=cv.getAttribute('height')));
 for(const x of [cv,document.getElementById(cv.id+'O')]){x.width=w*r;x.height=h*r;x.style.width=w+'px';x.style.height=h+'px'}
 const c=cv.getContext('2d');c.setTransform(r,0,0,r,0,0);return [c,w,h]}
/* 十字线: 画在上层透明画布, 不重画K线; 字的底是半透明, 不挡图 */
function ovClear(id){const o=document.getElementById(id+'O');o.getContext('2d').clearRect(0,0,o.width,o.height)}
function lab(c,x,y,s,al){c.font='11px ui-rounded,"SF Pro Rounded","PingFang SC",-apple-system,sans-serif';const w=c.measureText(s).width+8;let X=al==='r'?x-w:al==='c'?x-w/2:x;X=Math.max(0,Math.min(X,c.canvas.clientWidth-w));
 c.fillStyle='rgba(255,255,255,.18)';c.beginPath();c.roundRect?c.roundRect(X,y-8,w,16,4):c.rect(X,y-8,w,16);c.fill();c.fillStyle='#fff';c.fillText(s,X+4,y+4)}
function cross(id,x,y,W,H,pl,pr,px,bt,info,lp){const o=document.getElementById(id+'O'),r=devicePixelRatio||1,c=o.getContext('2d');c.setTransform(r,0,0,r,0,0);c.clearRect(0,0,W,H);
