<script>

const PW=(()=>{try{return window.parent!==window&&parent.LIVE?parent:null}catch(e){return null}})();

 const grp=k=>{const g={};(H[k]||[]).forEach(b=>{if(!(b.c>0))return;const s=String(b.t).replace(/\D/g,''),d=iso(s.slice(0,8));(g[d]=g[d]||[]).push([b.o||b.c,b.h||b.c,b.l||b.c,b.c,s.slice(8,10)+':'+s.slice(10,12)])});return g};
 const g1=grp('m1'),g5=grp('m5');const ds=new Set([...Object.keys(g1),...Object.keys(g5)]);
 ds.forEach(d=>{const a=(g1[d]&&(g1[d].length>=200||(g1[d][0][4]<='09:32'&&g1[d].length>=(g5[d]?g5[d].length*4:1))))?g1[d]:(g5[d]&&g5[d].length>=30?g5[d]:(g1[d]||g5[d]));out[d]=a.map(x=>x.slice(0,4));tm[d]=a.map(x=>x[4])});return {out,tm}}

let SRC=null;
/* 多股振幅做T引擎(和 flex.py 同一套, 参数可调). 只用当时已知的价; 只算差价; 费用逐笔扣 */
function decodeStock(S){const D={},TM={};let prev=S.p0;
 for(const d of S.days){const a=S.b[d],t=S.t[d],bars=[],ks=[];let p=prev,k=-1;
  for(let i=0;i<a.length;i+=4){const o=p+a[i];const h=o+a[i+1],l=o-a[i+2],c=l+a[i+3];bars.push([o/100,h/100,l/100,c/100]);p=c;k+=parseInt(t[i/4],36);ks.push(k)}
  if(prev==null){/* 第一天第一根: 编码时 p=第一根开盘 => a[0]=0 */}
  D[d]=bars;TM[d]=ks.map(k=>{const m=k<=120?570+k:780+(k-121);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')});prev=p}
 return {D,TM}}
function fee(a,s){return Math.max(5,a*2.5e-4)+a*0.1e-4+(s?a*5e-4:0)}
function pnl(s,b,q){return s*q-b*q-fee(s*q,1)-fee(b*q,0)}
const upT=t=>Math.ceil(Math.round(t*1e6)/1e4)/100, dnT=t=>Math.floor(Math.round(t*1e6)/1e4)/100;
function legsOf(bars,cut){const p=bars.map(b=>b[3]),up=[],dn=[];let dr=0,hp=p[0],lp=p[0],lp0=0,hp0=0;
 for(let i=1;i<p.length;i++){const x=p[i];hp=Math.max(hp,x);lp=Math.min(lp,x);
  if(dr>=0&&x<=hp*(1-cut)){if(dr===1)up.push(hp/lp0-1);dr=-1;hp0=hp;lp=x}
  else if(dr<=0&&x>=lp*(1+cut)){if(dr===-1)dn.push(1-lp/hp0);dr=1;lp0=lp;hp=x}}

const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
function prepInfo(S,D,cut){const days=S.days,pc={},AMP={},UP={},MA={},CAT={};
 const C=S.pre.concat(days.map(d=>D[d][D[d].length-1][3])),off=S.pre.length,L={};
 days.forEach(d=>L[d]=legsOf(D[d],cut));
 days.forEach((d,n)=>{if(n===0)return;pc[d]=D[days[n-1]][D[days[n-1]].length-1][3];
  const pv=days.slice(Math.max(1,n-20),n);if(pv.length)AMP[d]=mean(pv.map(z=>{const b=D[z];return (Math.max(...b.map(x=>x[1]))-Math.min(...b.map(x=>x[2])))/pc[z]}));
  const pu=days.slice(Math.max(0,n-20),n).flatMap(z=>L[z][0]);UP[d]=mean(pu);
  const i=n+off,w=C.slice(Math.max(0,i-10),i);MA[d]=w.length>=5?C[i-1]>=mean(w):false;
