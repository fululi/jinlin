<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>快照/闭环日志查看 · jinlin</title>
<style>
  body{margin:0;background:#0b1620;color:#eef9fc;font:14px/1.6 -apple-system,"PingFang SC",sans-serif;padding:14px}
  h1{font-size:16px;margin:4px 0 12px}
  h2{font-size:14px;margin:18px 0 6px;color:#7fd8ff}
  .card{background:#12222f;border:1px solid #23414f;border-radius:12px;padding:10px 12px;margin-bottom:10px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  td,th{padding:4px 6px;border-bottom:1px solid #1d3442;text-align:left;white-space:nowrap}
  th{color:#7fd8ff;font-weight:600}
  .ok{color:#1fdc93}.bad{color:#ff6b6b}.mut{color:#9fb3c8}
  pre{background:#0e1b26;border-radius:8px;padding:8px;font-size:11px;overflow:auto;max-height:300px;white-space:pre-wrap;word-break:break-all}
  .btn{display:inline-block;background:#155e75;color:#eafcff;border-radius:999px;padding:8px 16px;margin:6px 6px 0 0;text-decoration:none}
  .btn:active{opacity:.7}
</style>
</head>
<body>
<h1>jl_osnap_v1 / jl_tloop_log_v1 验收查看 <span class="mut" id="now"></span></h1>
<div class="card">
  <a class="btn" href="javascript:location.reload()">刷新</a>
  <a class="btn" href="javascript:void(0)" id="exp">导出全部 JSON</a>
  <a class="btn" href="./index.html">回工作台</a>
</div>
<h2>① 开盘快照 jl_osnap_v1（今日五窗：09:26 / 09:35 / 09:55 / 10:00 / 14:45）</h2>
<div class="card" id="snap"></div>
<h2>② 做T闭环证据 jl_tloop_log_v1（每窗±2分钟内每票每日各记一条）</h2>
<div class="card" id="tloop"></div>
<h2>③ 诊断：板块资金为什么暂缺 / 卖出价从哪来</h2>
<div class="card" id="diag"></div>
<h2>④ 买入闸日志 jl_gate_log_v1（交易时段每分钟≤1条，滚动≈2交易日，供阈值实盘回放）</h2>
<div class="card" id="gate"></div>
<h2>原始 JSON</h2>
<pre id="raw"></pre>
<script>
(function(){
  var WINS=["09:26","09:35","09:55","10:00","14:45"];
  function readJ(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
  function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
  function esc(s){return String(s==null?"—":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
  var td=today();
  document.getElementById("now").textContent=td;

  /* ① osnap */
  var snap=readJ("jl_osnap_v1"), sh="";
  if(!snap||!snap.recs){sh='<span class="bad">键不存在或无 recs——采样器未落盘</span>'}
  else{
    sh='<table><tr><th>窗口</th><th>今日记录</th><th>报价日</th><th>明细</th></tr>';
    WINS.forEach(function(w){
      var r=null;
      snap.recs.forEach(function(x){if(x.type==="win"&&x.win===w&&x.d===td)r=x});
      var miss=snap.recs.filter(function(x){return x.win===w&&x.d===td&&x.type!=="win"}).length;
      sh+='<tr><td>'+w+'</td><td>'+(r?'<span class="ok">✓ 已固定</span>':(miss?'<span class="bad">miss×'+miss+'</span>':'<span class="mut">无记录</span>'))+'</td><td>'+esc(r&&r.d)+'</td><td>'+(r?esc(JSON.stringify(r).slice(0,120)):"")+'</td></tr>';
    });
    sh+='</table><div class="mut">历史: recs 共 '+snap.recs.length+' 条；今日全部条目 '+snap.recs.filter(function(x){return x.d===td}).length+' 条（含 miss）</div>';
  }
  document.getElementById("snap").innerHTML=sh;

  /* ② tloop */
  var log=readJ("jl_tloop_log_v1"), th="";
  if(!log||!log.length){th='<span class="bad">键不存在或为空——今天还没有任何窗口记录（只有打开持仓详情页时才会落盘）</span>'}
  else{
    var tlog=log.filter(function(x){return x.d===td});
    th='<table><tr><th>窗口</th><th>代码</th><th>价</th><th>温度</th><th>评分</th><th>判定</th></tr>';
    if(!tlog.length)th+='<tr><td colspan="6" class="mut">今日无记录；日志共 '+log.length+' 条，最近一条 '+esc(log[log.length-1].d+" "+log[log.length-1].w+" "+log[log.length-1].code)+'</td></tr>';
    tlog.forEach(function(x){
      th+='<tr><td>'+esc(x.w)+'</td><td>'+esc(x.code)+'</td><td>'+esc(x.p)+'</td><td>'+esc(x.temp)+'</td><td>'+esc(x.score)+'</td><td>'+esc(x.verdict)+'</td></tr>';
    });
    th+='</table><div class="mut">今日 '+tlog.length+' 条 / 全部 '+log.length+' 条</div>';
  }
  document.getElementById("tloop").innerHTML=th;

  /* ③ 诊断 */
  var sfAll=readJ("jl_sector_ff_v1")||{}, tlog=readJ("tlog_v2")||[];
  var dh='<div>jl_sector_ff_v1 现有板块键（'+Object.keys(sfAll).length+'个）：</div><pre>'+esc(Object.keys(sfAll).join("、")||"（空）")+'</pre>';
  var secSeen={};
  (log||[]).forEach(function(x){ if(x.d===td) secSeen[x.code]=x.sec; });
  dh+='<div>tloop 今日日志里记到的板块名：</div><pre>'+esc(JSON.stringify(secSeen))+'</pre>';
  dh+='<div>tlog_v2 最近 10 条（卖出价锚点的来源）：</div><pre>'+esc(JSON.stringify(tlog.slice(-10),null,1))+'</pre>';
  document.getElementById("diag").innerHTML=dh;

  /* ④ 买入闸日志 */
  var gate=readJ("jl_gate_log_v1"), gh="";
  if(!gate||!gate.length){gh='<span class="mut">键不存在或为空——v0.89.0 起交易时段才落档；盘后/周末打开不会新增</span>'}
  else{
    var byDay={};
    gate.forEach(function(x){(byDay[x.d]=byDay[x.d]||[]).push(x)});
    var days=Object.keys(byDay).sort();
    gh='<table><tr><th>日期</th><th>条数</th><th>红</th><th>黄</th><th>绿</th><th>nodata</th><th>末条</th></tr>';
    days.forEach(function(d){
      var arr=byDay[d],c={red:0,yellow:0,green:0,nodata:0};
      arr.forEach(function(x){c[x.lvl]=(c[x.lvl]||0)+1});
      var last=arr[arr.length-1];
      gh+='<tr><td>'+esc(d)+'</td><td>'+arr.length+'</td><td class="bad">'+c.red+'</td><td>'+c.yellow+'</td><td class="ok">'+c.green+'</td><td class="mut">'+c.nodata+'</td><td class="mut">'+esc(last.hm+" "+last.lvl+" "+last.sum+"分")+'</td></tr>';
    });
    gh+='</table><div class="mut">共 '+gate.length+' 条 / '+days.length+' 个交易日。回放标定：点上方「导出全部 JSON」，用 gate回放_replay.js 跑（它同时需要本文件打包的上证日K）。</div>';
    gh+='<div class="mut">最近 5 条：</div><pre>'+esc(JSON.stringify(gate.slice(-5),null,1))+'</pre>';
  }
  document.getElementById("gate").innerHTML=gh;

  var dkSh=readJ("jl_dk_sh000001");
  document.getElementById("raw").textContent=JSON.stringify({jl_osnap_v1:snap,jl_tloop_log_v1:log,jl_gate_log_v1:gate},null,1);
  document.getElementById("exp").onclick=function(){
    try{
      var blob=new Blob([JSON.stringify({jl_osnap_v1:snap,jl_tloop_log_v1:log,jl_gate_log_v1:gate,jl_dk_sh000001:dkSh},null,1)],{type:"application/json"});
      var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="jinlin_验收_"+td+".json";a.click();
    }catch(e){alert("导出失败: "+e)}
  };
})();
</script>
</body>
</html>
