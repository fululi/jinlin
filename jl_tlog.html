<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>快照/闭环日志查看 · jinlin</title>
<style>
  body{margin:0;background:#0b1620;color:#eef9fc;font:14px/1.6 -apple-system,"PingFang SC",sans-serif;padding:14px}
  h1{font-size:16px;margin:4px 0 12px}
  h2{font-size:14px;margin:18px 0 6px;color:#7fd8ff}
  .card{background:#12222f;border:1px solid #23414f;border-radius:12px;padding:10px 12px;margin-bottom:10px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  td,th{padding:4px 6px;border-bottom:1px solid #1d3442;text-align:left;white-space:nowrap}
  th{color:#7fd8ff;font-weight:600}
  .ok{color:#1fdc93}.bad{color:#ff6b6b}.mut{color:#9fb3c8}
  pre{background:#0e1b26;border-radius:8px;padding:8px;font-size:11px;overflow:auto;max-height:300px;white-space:pre-wrap;word-break:break-all}
  .btn{display:inline-block;background:#155e75;color:#eafcff;border-radius:999px;padding:8px 16px;margin:6px 6px 0 0;text-decoration:none}
  .btn:active{opacity:.7}
</style>
</head>
<body>
<h1>jl_osnap_v1 / jl_tloop_log_v1 验收查看 <span class="mut" id="now"></span></h1>
<div class="card">
  <a class="btn" href="javascript:location.reload()">刷新</a>
  <a class="btn" href="javascript:void(0)" id="exp">导出全部 JSON</a>
  <a class="btn" href="./index.html">回工作台</a>
</div>
<h2>① 开盘快照 jl_osnap_v1（今日五窗：09:26 / 09:35 / 09:55 / 10:00 / 14:45）</h2>
<div class="card" id="snap"></div>
<h2>② 做T闭环证据 jl_tloop_log_v1（每窗±2分钟内每票每日各记一条）</h2>
<div class="card" id="tloop"></div>
<h2>③ 诊断：板块资金为什么暂缺 / 卖出价从哪来</h2>
<div class="card" id="diag"></div>
<h2>④ 买入闸日志 jl_gate_log_v2 + 日汇总 jl_gate_day_v1（v0.89.4起：盘中跳午休、结论变化才记+5分钟保底；明细留30交易日，日汇总每天1行长期保留，回放按日聚合用它）</h2>
<div class="card" id="gate"></div>
<h2>原始 JSON</h2>
<pre id="raw"></pre>
<script>
(function(){
  var WINS=["09:26","09:35","09:55","10:00","14:45"];
  function readJ(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
  function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
  function esc(s){return String(s==null?"—":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
  var td=today(), _qd=(location.search.match(/[?&]d=(\d{4}-\d{2}-\d{2})/)||[])[1]; if(_qd)td=_qd; /* jl-memo1: ?d=YYYY-MM-DD 看历史某天 */
  document.getElementById("now").textContent=td;

  /* ① osnap */
  var snap=readJ("jl_osnap_v1"), sh="", lastWin=null;
  if(!snap||!snap.recs){sh='<span class="bad">键不存在或无 recs——采样器未落盘</span>'}
  else{
    sh='<table><tr><th>窗口</th><th>今日记录</th><th>报价日</th><th>明细</th></tr>';
    WINS.forEach(function(w){
      var r=null;
      snap.recs.forEach(function(x){if(x.type==="win"&&x.win===w&&x.d===td)r=x});
      var miss=snap.recs.filter(function(x){return x.win===w&&x.d===td&&x.type!=="win"}).length;
      var lad="";
      if(r&&r.ps){var okN=0,bad=[];r.ps.forEach(function(p){if(!p.m)return;if(p.m.state==="stale")bad.push(p.name||p.code);else okN++});
        lad=(bad.length?'<span class="bad">梯子⚠ '+bad.length+'只过时：'+esc(bad.join("、"))+'</span>':'<span class="ok">梯子 '+okN+'只正常</span>')+'<br>';}
      sh+='<tr><td>'+w+'</td><td>'+(r?'<span class="ok">✓ 已固定</span>':(miss?'<span class="bad">miss×'+miss+'</span>':'<span class="mut">无记录</span>'))+'</td><td>'+esc(r&&r.d)+'</td><td>'+lad+(r?'<span class="mut">'+esc(JSON.stringify(r).slice(0,80))+'</span>':"")+'</td></tr>';
      if(r)lastWin=r;
    });
    sh+='</table>';
    if(lastWin&&lastWin.ps){ /* jl-memo1: 最近一窗逐票梯子核对 */
      sh+='<div style="margin-top:8px">最近一窗 '+esc(lastWin.win)+' 逐票梯子（锚点只能=昨收 或 跳空时=今日开盘；开盘前算的梯子标过时，数字照记）：</div><table><tr><th>票</th><th>锚点</th><th>昨收</th><th>今开</th><th>S1</th><th>B1</th><th>梯子</th></tr>';
      lastWin.ps.forEach(function(p){var m=p.m||{},q=p.q||{};
        sh+='<tr><td>'+esc(p.name||p.code)+'</td><td>'+esc(m.anchor)+'</td><td>'+esc(q.pv)+'</td><td>'+esc(q.op)+'</td><td>'+esc(m.S1)+'</td><td>'+esc(m.B1)+'</td><td>'+(m.state==="stale"?'<span class="bad">⚠ 过时</span><div class="mut">'+esc(m.why)+'</div>':(p.m?'<span class="ok">✓</span>':'<span class="mut">无</span>'))+'</td></tr>'});
      sh+='</table>';
    }
    sh+='<div class="mut">历史: recs 共 '+snap.recs.length+' 条；今日全部条目 '+snap.recs.filter(function(x){return x.d===td}).length+' 条（含 miss）</div>';
  }
  document.getElementById("snap").innerHTML=sh;

  /* ② tloop */
  var log=readJ("jl_tloop_log_v1"), th="";
  if(!log||!log.length){th='<span class="bad">键不存在或为空——今天还没有任何窗口记录（只有打开持仓详情页时才会落盘）</span>'}
  else{
    var tlog=log.filter(function(x){return x.d===td});
    th='<table><tr><th>窗口</th><th>代码</th><th>价</th><th>温度</th><th>评分</th><th>判定</th></tr>';
    if(!tlog.length)th+='<tr><td colspan="6" class="mut">今日无记录；日志共 '+log.length+' 条，最近一条 '+esc(log[log.length-1].d+" "+log[log.length-1].w+" "+log[log.length-1].code)+'</td></tr>';
    tlog.forEach(function(x){
      th+='<tr><td>'+esc(x.w)+'</td><td>'+esc(x.code)+'</td><td>'+esc(x.p)+'</td><td>'+esc(x.temp)+'</td><td>'+esc(x.score)+'</td><td>'+esc(x.verdict)+'</td></tr>';
    });
    th+='</table><div class="mut">今日 '+tlog.length+' 条 / 全部 '+log.length+' 条</div>';
  }
  document.getElementById("tloop").innerHTML=th;

  /* ③ 诊断 */
  var sfAll=readJ("jl_sector_ff_v1")||{}, tlog=readJ("tlog_v2")||[];
  var dh='<div>jl_sector_ff_v1 现有板块键（'+Object.keys(sfAll).length+'个）：</div><pre>'+esc(Object.keys(sfAll).join("、")||"（空）")+'</pre>';
  var secSeen={};
  (log||[]).forEach(function(x){ if(x.d===td) secSeen[x.code]=x.sec; });
  dh+='<div>tloop 今日日志里记到的板块名：</div><pre>'+esc(JSON.stringify(secSeen))+'</pre>';
  dh+='<div>tlog_v2 最近 10 条（卖出价锚点的来源）：</div><pre>'+esc(JSON.stringify(tlog.slice(-10),null,1))+'</pre>';
  document.getElementById("diag").innerHTML=dh;

  /* ④ 买入闸日志 */
  var gate=readJ("jl_gate_log_v2")||{}, gday=readJ("jl_gate_day_v1")||{}, gate1=readJ("jl_gate_log_v1"), gh="";
  var gdays=Object.keys(gday).sort();
  if(!gdays.length){gh='<span class="mut">日汇总为空——v0.89.4 起盘中（9:30–15:00，跳午休，节假日不记）才落档；盘后/周末打开不会新增</span>'}
  else{
    gh='<table><tr><th>日期</th><th>条数</th><th>红</th><th>黄</th><th>绿</th><th>nodata</th><th>首条</th><th>末条</th></tr>';
    gdays.slice(-15).forEach(function(d){
      var x=gday[d],c=x.c||{},f=x.f||{},l=x.l||{};
      gh+='<tr><td>'+esc(d)+'</td><td>'+x.n+'</td><td class="bad">'+(c.red||0)+'</td><td>'+(c.yellow||0)+'</td><td class="ok">'+(c.green||0)+'</td><td class="mut">'+(c.nodata||0)+'</td><td class="mut">'+esc(f.hm+" "+f.lvl+" "+f.sum+"分")+'</td><td class="mut">'+esc(l.hm+" "+l.lvl+" "+l.sum+"分"+(l.soft?" ·"+l.soft:""))+'</td></tr>';
    });
    var nd=Object.keys(gate).length, ne=0; Object.keys(gate).forEach(function(d){ne+=(gate[d]||[]).length});
    gh+='</table><div class="mut">日汇总 '+gdays.length+' 个交易日（表里显示最近15天）；明细 '+ne+' 条 / '+nd+' 天。回放：点上方「导出全部 JSON」，用 gate回放_replay.js 跑（同时打包了上证日K）。hm=当日分钟数(600=10:00)。</div>';
    var lastD=Object.keys(gate).sort().pop();
    if(lastD)gh+='<div class="mut">最近 5 条（'+esc(lastD)+'）：</div><pre>'+esc(JSON.stringify((gate[lastD]||[]).slice(-5),null,1))+'</pre>';
  }
  if(gate1&&gate1.length)gh+='<div class="mut">旧版 jl_gate_log_v1 还有 '+gate1.length+' 条（已停写，口径作废，仅随导出存档）</div>';
  document.getElementById("gate").innerHTML=gh;

  var dkSh=readJ("jl_dk_sh000001");
  document.getElementById("raw").textContent=JSON.stringify({jl_osnap_v1:snap,jl_tloop_log_v1:log,jl_gate_day_v1:gday,jl_gate_log_v2:gate},null,1);
  document.getElementById("exp").onclick=function(){
    try{
      var blob=new Blob([JSON.stringify({jl_osnap_v1:snap,jl_tloop_log_v1:log,jl_gate_day_v1:gday,jl_gate_log_v2:gate,jl_gate_log_v1:gate1,jl_dk_sh000001:dkSh},null,1)],{type:"application/json"});
      var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="jinlin_验收_"+td+".json";a.click();
    }catch(e){alert("导出失败: "+e)}
  };
})();
</script>
</body>
</html>
