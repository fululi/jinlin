<script>
/* ================= 算法（纯函数，可单独测） ================= */
const fee=(amt,sell)=>Math.max(5,amt*0.00025)+amt*0.00001+(sell?amt*0.0005:0);
function calc(sp,bp,sq,bq){const n=Math.min(sq,bq),fs=fee(sp*sq,1)/sq,fb=fee(bp*bq,0)/bq,f=(fs+fb)*n;return {n,gross:(sp-bp)*n,fee:f,net:(sp-bp)*n-f};}
function tdays(d1,d2){let a=new Date(d1.slice(0,10)+'T00:00'),b=new Date(d2.slice(0,10)+'T00:00'),n=0;while(a<b){a.setDate(a.getDate()+1);const w=a.getDay();if(w&&w!==6)n++;}return n;}
const STALE=5;
/* 配对：按成交时间逐笔处理。新的一笔先配「指定的那笔」(手动)，再配没超5天的反向挂账：日子越近越先，同一天按时间先后 */
function pair(log){
  const L=log.slice().sort((a,b)=>a.ts<b.ts?-1:a.ts>b.ts?1:a.id-b.id), open=[], rounds=[];
  L.forEach(e=>{
    let left=e.q; const fu=fee(e.p*e.q,e.side==='s')/e.q;
    const take=(o,manual)=>{ const n=Math.min(o.left,left); if(n<=0) return;
      const S=e.side==='s'?{p:e.p,fu}:o, B=e.side==='s'?o:{p:e.p,fu};
      rounds.push({manual,meth:o.meth,openId:o.id,openTs:o.ts,openSide:o.side,openP:o.p,openQ:o.q,closeId:e.id,closeTs:e.ts,closeP:e.p,n,net:(S.p-B.p)*n-(S.fu+B.fu)*n});
      o.left-=n; left-=n; };
    if(e.target){ const o=open.find(x=>x.id===e.target&&x.left>0&&x.side!==e.side); if(o) take(o,true); }
    open.filter(o=>o.left>0&&o.side!==e.side&&tdays(o.ts,e.ts)<=STALE)
      .sort((a,b)=>{const da=a.ts.slice(0,10),db=b.ts.slice(0,10); return da!==db?(da<db?1:-1):(a.ts<b.ts?-1:a.ts>b.ts?1:a.id-b.id);})
      .forEach(o=>{ if(left>0) take(o,false); });
    if(left>0) open.push({id:e.id,side:e.side,p:e.p,q:e.q,ts:e.ts,meth:e.meth,left,fu});
  });
  return {open:open.filter(o=>o.left>0),rounds};
}

/* ================= 页面 ================= */
/* 11-23: TODAY 原写死 2026-11-21 → 真日期（记账默认日/挂了几天/日线波段收盘判断都靠它） */
const TODAY=(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})(), METHODS=['尺子','小球','今日共振','明日共振','五日图斐波','15分斐波','三角','自己判断'];
const STK={'600105':{name:'永鼎股份',p:19.20,at:'11-20 15:00 收盘',hold:2000,sp:20.20,bp:19.30,ma20:22.55,fib:1},
           '000892':{name:'欢瑞世纪',p:3.58,at:'11-20 15:00 收盘 · 11-23 停牌',hold:1900,sp:3.70,bp:3.55,ma20:null,fib:0}};
const K='zpT_panel_v1';
const blank=c=>({mode:'s',sp:STK[c].sp,bp:STK[c].bp,sq:1000,bq:1000,meth:'自己判断',log:[],seq:0,target:0,demo:0});
let st=JSON.parse(localStorage.getItem(K)||'null')||{code:'600105',s:{}};
Object.keys(STK).forEach(c=>{ if(!st.s[c]) st.s[c]=blank(c); });
const $=id=>document.getElementById(id), f=v=>v.toFixed(2), S=()=>st.s[st.code], T=()=>STK[st.code];
const HOLD=()=>S().hold||T().hold;
const NOW=()=>T().p, AT=()=>T().at;
const yuan=(v,u)=>(v>=0?'+':'−')+Math.abs(Math.round(v)).toLocaleString()+(u===0?'':' 元');
/* % 小字（11-23 拍板口径，公式定死、数字动态算，快照不写死）：
   大腿反弹%＝(价−现价)/现价 · 本段%＝(价−起点A)/起点A · 日线%＝(价−起点25.20)/25.20 · 算账差%＝(卖−买回)/买回。
   c.base 即各卡基准；差值 <0.05% 不显示（避免 0.0% 噪音）。字小、亮色，禁灰。 */
const pctS=(v,base)=>{ if(!base) return ''; const d=v/base-1; return Math.abs(d)*100<0.05?'':(d>=0?'+':'−')+Math.abs(d*100).toFixed(1)+'%'; };
const hm=ts=>ts.slice(5,10)+' '+ts.slice(11,16);
/* 价位带收集器：各卡把自己的买卖价 push 进来，drawBand 按「跨卡出现张数」排序渲染 */
const BAND={list:[],triRows:[],triBrk:null,sw:[]};
/* 11-23t 用户「保存的也没保存上」: 原来整包覆盖且不接错误。现在存前先读本机已存的——哪只票的记录版本(rev)更新就用它(防另一个开着的面板拿旧数据盖掉)；存不进去不再抛错，记一笔时读回核对 */
function syncS(){ try{ const o=JSON.parse(localStorage.getItem(K)||'null'); if(!o||!o.s) return; Object.keys(o.s).forEach(c=>{ const a=o.s[c], b=st.s[c]; if(!a) return; if(!b){ st.s[c]=a; return; } if((a.rev||0)>(b.rev||0)){ b.log=a.log||[]; b.seq=Math.max(a.seq||0,b.seq||0); b.rev=a.rev; b.target=a.target||0; } }); }catch(e){} }
const mutS=()=>{ syncS(); const s=S(); s.rev=(s.rev||0)+1; return s; };
const save=()=>{ syncS(); try{ localStorage.setItem(K,JSON.stringify(st)); return true; }catch(e){ window.__ztSaveErr=(e&&e.name)||'err'; return false; } };
const savedOK=id=>{ try{ const o=JSON.parse(localStorage.getItem(K)||'null'); return !!(o&&o.s&&o.s[st.code]&&(o.s[st.code].log||[]).some(x=>x.id===id)); }catch(e){ return false; } };
addEventListener('storage',e=>{ if(e.key===K){ syncS(); try{ drawLog(); }catch(x){} } });

/* ---- 自选股：点开下拉选「＋ 添加自选」→ 输 6 位代码+名称 → 进下拉并切换（自定义股存 localStorage） ---- */

Object.keys(MYSTK).forEach(c=>{ if(!STK[c]) STK[c]=MYSTK[c]; });
function rebuildCode(){ const sel=$('code'); sel.innerHTML=Object.keys(STK).map(c=>'<option value="'+c+'">'+STK[c].name+'</option>').join('')+'<option value="__add">＋ 添加自选</option>'; sel.value=st.code; }
function addStock(code,name){ code=String(code||'').trim(); name=String(name||'').trim()||code;
  if(!/^\d{6}$/.test(code)) return {err:'代码要 6 位数字'};
  if(!STK[code]){ STK[code]={name:name,p:0,at:'未接行情',hold:0,sp:0,bp:0,ma20:null,fib:0}; MYSTK[code]=STK[code];
    try{ localStorage.setItem('tpanel_stk',JSON.stringify(MYSTK)); }catch(e){} }
  rebuildCode(); return {code:code,name:name}; }
rebuildCode();

/* ---- 左右滑 ---- */
/* 11-23 用户「左右滑还是有点卡壳…像苹果手机左右滑动选择哪个超方便」: 原来是横向滚动吸附+滚动每帧改高度+5秒重画撞上→跳。
   现在不滚了：只显示当前一张，点格直接出(无动画)；在卡上快速左右划一下=上/下一张(图表SVG/输入框/拖柄上不算，免得和十字线抢)；记住上次看的那张 */
function rail(railId,tabId,names,opt){
  opt=opt||{}; const R=$(railId), tb=$(tabId), K='tpanel_rail_'+railId;
  tb.innerHTML=names.map((n,i)=>'<button data-i="'+i+'">'+n+(opt.grid?'<small id="'+tabId+'_s'+i+'"></small>':'')+'</button>').join('');
  if(opt.grid) tb.classList.add('segg');
  R.classList.add('rail1');
  let cur=0; try{ const v=+(localStorage.getItem(K)||0); if(v>=0&&v<names.length) cur=v; }catch(e){}
  const show=i=>{ cur=i; [...R.children].forEach((sl,k)=>{ sl.style.display=k===i?'':'none'; });   /* 用 style 不用 class：各卡重画会 className='slide' 冲掉 class */ [...tb.children].forEach((b,k)=>b.className=k===i?'on':''); try{ localStorage.setItem(K,String(i)); }catch(e){} };
  tb.onclick=e=>{ const b=e.target.closest('button'); if(b) show(+b.dataset.i); };
  let sx=0,sy=0,st=0,ok=0;
  R.addEventListener('touchstart',e=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; st=Date.now(); ok=!(e.target.closest&&e.target.closest('svg,input,textarea,select,.zhd,.chips')); },{passive:true});
  R.addEventListener('touchend',e=>{ if(!ok) return; const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(Date.now()-st<600&&Math.abs(dx)>60&&Math.abs(dx)>2*Math.abs(dy)) show(Math.max(0,Math.min(names.length-1,cur+(dx<0?1:-1)))); },{passive:true});
  show(cur);
  return {go:show,tabs:tb,mark:()=>show(cur),cur:()=>cur};
}

/* ---- 斐波 ---- */
function spark(path){
  const ps=path.map(p=>p[0]), lo=Math.min(...ps), hi=Math.max(...ps), W=118, H=44;
  const X=i=>6+i*(W-12)/(path.length-1), Y=p=>8+(hi-p)/((hi-lo)||1)*(H-16);
  let s='<svg class="spark" viewBox="0 0 '+W+' '+H+'"><polyline points="'+path.map((p,i)=>X(i).toFixed(1)+','+Y(p[0]).toFixed(1)).join(' ')+'" fill="none" stroke="#fff" stroke-width="1.1" stroke-linejoin="round"/>';
  path.forEach((p,i)=>{const last=i===path.length-1, y=Y(p[0]);
    s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(last?2.8:1.6)+'" fill="'+(last?'#0b131d':'#fff')+'" stroke="#fff" stroke-width="1.1"/>';
    if(p[1]) s+='<text x="'+X(i).toFixed(1)+'" y="'+(y<16?y+11:y-4).toFixed(1)+'" font-size="8.5" fill="#fff" text-anchor="middle">'+p[1]+'</text>';});
  return s+'</svg>';
}
/* 斐波卡（v1 的梯子图 + 角色名）：
   左＝这段怎么走的（和右边价位同一把尺，点对着线）；右＝价位梯子，每行「角色 · 价 · 按几股≈元」。
   颜色按 v1：每档自己的颜色（起点/压力＝粉红，目标＝绿，0.382蓝/0.5紫/0.618橙/0.786粉红），现价＝绿；走到过的划掉。金底＝0.5–0.618。 */
/* 11-21 用户「尺子对着现价、字亮、一眼清楚」: 线按真实价位画(不等距)；字默认放在自己线的上方(不压线)；
   和上一行挤得放不下时，改放到自己线的下方；再不够才往下推。现价也一起排。 */
function stackLabels(items){ // items:[{y}] → 每个加 .t（字的基线）。字不能碰任何一条线，也不能和上一行字挤在一起
  const a=items.slice().sort((p,q)=>p.y-q.y), lines=items.map(x=>x.y); let prev=-1e9;
  const clear=t=>t>=prev+16&&lines.every(ly=>ly<t-13||ly>t+2);
  a.forEach(it=>{ let t=[it.y-4,it.y+15].find(clear); if(t==null){ t=Math.max(prev+16,it.y-4); while(!clear(t)&&t<it.y+80) t++; } it.t=t; prev=t; });
  return items;
}

/* 斐波卡（v1 风格）：左走势、右价位，线按真实价位画（对着现价）；每档自己的颜色；字在线上方、亮 */
function fibCard(id,c){
  const N=NOW(), s=S(), W=400, X0=150, XR=W-6, L=12, PR=X0-14;
  const rows=c.rows.slice().sort((a,b)=>b.p-a.p), ps=rows.map(r=>r.p).concat(c.path.map(p=>p[0]),[N]);
  const hi=Math.max(...ps), lo=Math.min(...ps), H=Math.max(180,rows.length*27+34), Y=p=>16+(hi-p)/((hi-lo)||1)*(H-30);
  let near=null,nd=1e9; if(!c.pause) rows.forEach(r=>{ if(!r.done&&!r.anchor){const d=Math.abs(r.p-N); if(d<nd){nd=d;near=r;}} });
  let sv='<svg viewBox="0 0 '+W+' '+H+'" style="margin-top:4px">';
  const g=rows.filter(r=>r.gold); if(g.length===2) sv+='<rect x="'+X0+'" y="'+Y(g[0].p)+'" width="'+(XR-X0)+'" height="'+(Y(g[1].p)-Y(g[0].p))+'" fill="#ffd66e" fill-opacity=".08"/>';
  const px=i=>L+i*(PR-L)/(c.path.length-1);

   共振=价位带合并后的×≥2(没到过)；斐波=15分本段/20天大腿/日线三卡的档位；ATR=昨收±ATR5(jl_reso atr5 同公式)；
   IV=没补的日缺口(先读首页 jl_gaplog_v1，同 jl_reso；没有就用日K现算)；BOLL=15分 BOLL20±2σ 曲线。卖在现价上方=红虚线，接在下方=绿虚线；到过的不画(在复盘)。 */
/* 11-23 用户「五日卡还是没之前做的细」: 把 11-22 设计稿那张五日卡(五日/尺A/尺B/下拉/BOLL/△三角/IV)做活。
   数据=腾讯五日1分钟分时 day/query(同 jl_card5d，三域名轮询，55秒刷)；尺A/尺B/下拉=jl_card5d autoCalc 原样搬(下面这段逐字，只给最后一个交易日)；
   △三角=三角卡 triV2 同一结果(15分/5分/日)画上沿+平底+量幅；ATR=jl_reso atr5；IV=w5Gaps；BOLL=15分 BOLL20±2σ；共振=价位带×≥2。 */
const AR=[0.236,0.382,0.5,0.618,0.786,0.886], AB=[1.272,1.618,2.618,3.618,4.618], AD=[1.272,1.618,2.618];
    function autoCalc(Pr) {
      const N = Pr.length; if (N < 4) return null;
      const op = Pr[0];
      let iH = 0; for (let k = 1; k < N; k++) if (Pr[k] > Pr[iH] && (iH !== 0 || Pr[k] >= op * 1.004)) iH = k;
      let iLa = -1, iLb = -1;
      for (let k = iH + 1; k < N; k++) if (iLa < 0 || Pr[k] < Pr[iLa]) iLa = k;
      for (let k = 0; k < iH; k++) if (iLb < 0 || Pr[k] < Pr[iLb]) iLb = k;
      let i0, kind;
      if (iLa >= 0 && (iLb < 0 || Pr[iLa] < Pr[iLb])) { i0 = iLa; kind = "反弹"; } else if (iLb >= 0) { i0 = iLb; kind = "回撤"; } else return null;
      const H = Pr[iH], L0 = Pr[i0], g = H - L0;
      if (!(g > H * 0.004)) return null;
      const A = { a: { k: i0, p: L0 }, b: { k: iH, p: H }, at: (r) => L0 + g * r };
      let iL = 0; for (let k = 1; k < N; k++) if (Pr[k] < Pr[iL]) iL = k;
      let B = null;
      for (let k = iL + 1; k < N - 1; k++) {
        if (!(Pr[k] > Pr[k - 1] && Pr[k] >= Pr[k + 1])) continue;
        if (Pr[k] < Pr[iL] * 1.003) continue;
        let ok = false;
        for (let j = k + 1; j < N; j++) { if (Pr[j] > Pr[k]) break; if (Pr[j] <= Pr[k] * 0.9985) { ok = true; break; } }
        if (ok) { const lo = Pr[iL], gb = Pr[k] - lo; B = { a: { k: iL, p: lo }, b: { k, p: Pr[k] }, at: (r) => lo + gb * r }; break; }
      }
      const P = Pr[N - 1];
      let reb = -Infinity; if (kind === "反弹") for (let k = Math.max(1, i0); k < N; k++) reb = Math.max(reb, Pr[k]);
      const rebR = kind === "反弹" ? (reb - L0) / g : null;
      let D = null;
      if (kind === "反弹" && rebR >= 0.382 && P < A.at(0.236)) D = { a: { k: iH, p: H }, b: { k: i0, p: L0 }, at: (r) => H - g * r };
      const hitR = rebR == null ? null : [0.886, 0.786, 0.618, 0.5, 0.382].find((r) => rebR >= r - 0.015);
      let st;
      if (D) st = { txt: "反弹到 " + hitR + " 后回落 → 看下拉尺", col: "#3fe6ab" };
      else if (kind === "反弹") st = hitR ? { txt: "反弹到过 " + hitR + (P < A.at(hitR) ? " · 回落中" : ""), col: hitR >= 0.786 ? "#ffd84a" : "#fff" } : { txt: "反弹未到 0.382", col: "#fff" };
      else st = { txt: "冲过开盘 · 回撤看 0.382 / 0.618", col: "#fff" };
      return { P, A, B, D, kind, st };
    }

const D5={code:'',days:[],ts:0,busy:0,err:''};
function d5Load(force){ const code=st.code; if(!/^\d{6}$/.test(code)) return; if(D5.busy&&D5.code===code) return;
  if(!force&&D5.code===code&&D5.days.length&&Date.now()-D5.ts<55000) return;
  if(D5.code!==code){ D5.code=code; D5.days=[]; D5.err=''; } D5.busy=1; const sy=lkSym(code);
  lkGet('/appstock/app/day/query?code='+sy,j=>{ const n=j&&j.data&&j.data[sy]; return n&&n.data&&n.data.length?n.data:null; })
    .then(a=>{ D5.busy=0; if(st.code!==code) return;
      D5.days=a.slice().reverse().map(d=>({date:String(d.date),prec:+d.prec,pts:(d.data||[]).map(s=>{ const q=String(s).split(' '); return {hm:q[0],p:+q[1]}; }).filter(p=>p.p>0&&p.hm<='1500')})).filter(d=>d.pts.length);
      D5.err=''; D5.ts=Date.now(); try{ drawBand(); }catch(e){ console.warn('[做T面板] 五日图',e&&e.message); } })
    .catch(e=>{ D5.busy=0; D5.err='五日分时没取到'; D5.ts=Date.now()-40000; try{ w5Chart(); }catch(x){} }); }
const w5Slot=hm=>{ const m=+String(hm).slice(0,2)*60+ +String(hm).slice(2,4); return m<=690?Math.max(0,m-570):Math.min(241,m-780+121); };
/* 三角反抽：下降三角跌破平底后，收盘又站上(延长的)上沿 = BOS↑；上升三角升破平顶后又跌破下沿 = BOS↓。只认收盘；最后一根还在走的标「盘中」 */
function triRe(r,kl,nm){ if(!r||r.kind==='none'||!r.brkDir||r.at<0) return null;
  if(!((r.dir<0&&r.brkDir<0)||(r.dir>0&&r.brkDir>0))) return null;
  const U2=i=>r.top[1]+r.slope*(i-r.a), up=r.brkDir<0, n=kl.length;
  /* 11-23 用户「日K图上没看到突破，最高20.14」: 上沿和平底交汇(顶点)以后，上沿延长线跑到平底另一侧，不再有意义 → 这之后只认收盘收回平底(上升三角=跌回平顶) */
  const dead=i=>up?U2(i)<=r.flat:U2(i)>=r.flat;
  for(let i=r.at+1;i<n;i++){ const c=kl[i][4], ln=dead(i)?r.flat:U2(i); if(up?c>ln*1.001:c<ln*0.999){
    const t=String(kl[i][0]), last=i===n-1, pend=last&&(nm==='日'?(t.slice(0,10)===TODAY&&new Date().getHours()*100+new Date().getMinutes()<1500):HQ.mktLive());
    return {i,p:ln,c,up,pend,back:up?c>r.flat:c<r.flat,flat:dead(i)}; } }
  return null; }
/* 11-23 顶点(上沿与平底交汇)所在K线序号；还没到=大于最后一根 */
function triApex(r){ if(!r||r.kind==='none'||!r.slope) return Infinity; return Math.ceil(r.a+(r.flat-r.top[1])/r.slope); }

function w5Gaps(){ const out=[], code=st.code;
  try{ const lim=new Date(Date.now()-30*864e5).toISOString().slice(0,10), log=JSON.parse(localStorage.getItem('jl_gaplog_v1')||'{}')||{};
    Object.keys(log).forEach(k=>{ const g=log[k]; if(g&&String(g.c).replace(/\D/g,'')===code&&(g.lv==='日'||g.lv==='开')&&!g.ft&&String(g.ct)>=lim&&g.lo>0&&(g.hi-g.lo)/g.lo>=0.01) out.push({lo:+g.lo,hi:+g.hi,d:String(g.ct).slice(5,10),src:'首页缺口'}); }); }catch(e){}
  if(out.length) return out;
  const d=lkSettled().slice(-31);   /* 首页没记录时：日K现算，30天内跳空≥1%且后面没完全回补(回补一部分就缩小) */
  for(let i=1;i<d.length;i++){ let lo,hi; if(d[i][3]>d[i-1][2]){ lo=d[i-1][2]; hi=d[i][3]; } else if(d[i][2]<d[i-1][3]){ lo=d[i][2]; hi=d[i-1][3]; } else continue;
    const up=d[i][3]>d[i-1][2];
    for(let k=i+1;k<d.length&&hi>lo;k++){ if(up) hi=Math.min(hi,d[k][3]); else lo=Math.max(lo,d[k][2]); }
    const T0=T(); if(up&&T0.dl>0) hi=Math.min(hi,T0.dl); if(!up&&T0.dh>0) lo=Math.max(lo,T0.dh);
    if(hi>lo&&(hi-lo)/lo>=0.01) out.push({lo,hi,d:String(d[i][0]).slice(5,10),src:'日K算'}); }
  return out; }
function w5Atr(){ const d=lkSettled(); if(d.length<8) return null; const tr=[]; for(let i=1;i<d.length;i++){ const b=d[i],pc=d[i-1][4]; tr.push(Math.max(b[2]-b[3],Math.abs(b[2]-pc),Math.abs(b[3]-pc))); }
  let a=0,k; for(k=0;k<5;k++) a+=tr[k]; a/=5; for(k=5;k<tr.length;k++) a=(a*4+tr[k])/5;   /* = jl_reso atr5 */
  const c=d[d.length-1][4]; return {up:c+a,dn:c-a,a:a,c:c}; }

  else dates.forEach((d,i)=>{ const x=L+i/nd*(R-L); if(i) sv+='<line x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+TOP+'" y2="'+BOT+'" stroke="rgba(255,255,255,.14)"/>';
